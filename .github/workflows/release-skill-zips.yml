# Publishes one upload-ready .zip per skill (Claude chat → Customize → Skills → Upload a skill)
# as a GitHub release named after .claude-plugin/plugin.json's version. Each archive holds the skill
# folder at its top level (`<name>/SKILL.md`), the layout Claude's upload expects.
name: Release skill zips
on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json', 'skills/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zips
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            [ -f "$name/SKILL.md" ] || continue
            zip -qr "../dist/$name.zip" "$name"
          done
          ls -l ../dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(jq -r .version .claude-plugin/plugin.json)"
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" dist/*.zip --clobber
          else
            gh release create "$v" dist/*.zip --title "$v" --notes "Skill zips for Claude chat (Customize → Skills → Upload a skill). Prefer the marketplace: Customize → Plugins → Add marketplace → VitrinaDev/skills." --latest
          fi
